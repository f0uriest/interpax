name: Ruff

on: [pull_request, workflow_dispatch]

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: Ruff
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # keep this pin in sync with the "lint" extra in pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.7
      - name: Ruff lint
        run: ruff check --output-format=github interpax/ tests/
      - name: Ruff format check
        run: ruff format --check interpax/ tests/
