[build-system]
# setuptools >= 77 is needed for PEP 639 SPDX license metadata.
# versioneer[toml] (upstream) reads its config from [tool.versioneer] below;
# the old versioneer-518 fork could only read it from setup.cfg.
requires = ["setuptools>=77.0.0", "versioneer[toml]>=0.29"]
build-backend = "setuptools.build_meta"

[project]
name = "interpax"
description = "Interpolation and function approximation with JAX"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rory Conlin", email = "mail@fouriest.net" }]
keywords = [
  "interpolation",
  "spline",
  "cubic",
  "fourier",
  "approximation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "equinox >= 0.11.0, < 0.14",
  "jax >= 0.5.0, < 0.12",
  "jaxtyping >= 0.2.24, < 0.4",
  "lineax >= 0.0.5, < 0.2",
  "numpy >= 1.20.0, < 2.6",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
  "scipy >= 1.10.0, < 1.19",
  "pytest >= 5.0.0, < 9.2",
  "pytest-cov >= 2.6, < 7.2",
]
docs = [
  "sphinx >= 3.0.0, < 9.2",
  "sphinx_copybutton < 0.6",
  "sphinx-rtd-theme >= 1.0, < 3.2",
  "sphinx-github-style >= 1.0, < 1.3",
]
lint = [
  # keep this pin in sync with .pre-commit-config.yaml and .github/workflows/ruff.yml
  "ruff == 0.16.8",
  "pre-commit < 4.8",
  "pyright < 1.2",
]
# everything needed to develop interpax: `pip install -e ".[dev]"`
dev = ["interpax[test,docs,lint]", "build"]

[project.urls]
Homepage = "https://github.com/f0uriest/interpax"
Documentation = "https://interpax.readthedocs.io/"
"Source Code" = "https://github.com/f0uriest/interpax/"
"Issues Tracker" = "https://github.com/f0uriest/interpax/issues"
Contributing = "https://github.com/f0uriest/interpax/blob/master/CONTRIBUTING.rst"

[tool.setuptools.packages.find]
exclude = ["docs*", "tests*", "local*", "report*"]

[tool.setuptools.package-data]
interpax = ["py.typed"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "interpax/_version.py"
versionfile_build = "interpax/_version.py"
tag_prefix = "v"
parentdir_prefix = "interpax-"

[tool.pytest.ini_options]
markers = [
  "unit: marks small unit tests",
  "regression: marks end to end regression tests",
  "slow: marks tests as slow (deselect with '-m \"not slow\"').",
  "fast: mark tests as fast.",
]
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
  # ignore benign Cython warnings on ndarray size
  "ignore:numpy.ndarray size changed:RuntimeWarning",
  # ignore benign ml_dtypes DeprecationWarning
  "ignore::DeprecationWarning:ml_dtypes.*",
  # ignore DeprecationWarnings from dependency packages
  "ignore::DeprecationWarning:(?!interpax)",
]

[tool.coverage.run]
# we only care about the coverage of the source itself
# otherwise it measures coverage of the tests themselves as well
source = ["interpax/"]
# _version.py is generated code, no need to count it
omit = ["interpax/_version.py"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
ignore_errors = true

[tool.pyright]
include = ["interpax/*.py", "tests/*.py"]
exclude = ["interpax/_version.py", "docs/*", "build/*", "setup.py"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs", "build", "local", "interpax/_version.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "ERA", "UP", "C901"]
ignore = [
  "E731",   # lambda expressions are useful
  "E741",   # variable names like "l" are common for mode numbers
  "D401",   # don't want to always use "imperative mood" in docstrings
  "D105",   # don't care about docstrings in __dunder__ methods
  "W505",   # doc line length handled elsewhere
  "F722",   # jaxtyping shape annotations are not valid forward references
]

[tool.ruff.lint.per-file-ignores]
# need to import things to top level even if they aren't used there
"interpax/__init__.py" = ["F401"]
"tests/*" = ["D101", "D102", "D103", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 15
